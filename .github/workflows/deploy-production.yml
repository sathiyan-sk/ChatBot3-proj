
name: Deploy RenAI Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serialize production deployments.
concurrency:
  group: renai-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          TARGET: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "$TARGET")"
          else
            CHANGED_FILES="$(git diff --name-only "$BEFORE" "$TARGET")"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if grep -q '^frontend/' <<< "$CHANGED_FILES"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -q '^backend/' <<< "$CHANGED_FILES"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_COMMIT: ${{ github.sha }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend }}
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
        run: |
          echo "Target commit: $TARGET_COMMIT"
          echo "Frontend changed: $FRONTEND_CHANGED"
          echo "Backend changed: $BACKEND_CHANGED"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /home/sathyan/Myfile/chatbot3 && ./deploy.sh '$TARGET_COMMIT' '$FRONTEND_CHANGED' '$BACKEND_CHANGED'"
